# Nginx serves the production React build and acts as a reverse proxy for the API.
server {
    # Listen on port 80 inside the frontend container.
    listen 80;

    # '_' is a catch-all server name for local Docker usage.
    server_name _;

    # Directory containing the files copied from the Vite build stage.
    root /usr/share/nginx/html;
    index index.html;

    # Forward browser requests beginning with /api/ to the backend service.
    # "backend" is the Docker Compose service name, not localhost.
    location /api/ {
        proxy_pass http://backend:8000;

        # Use HTTP/1.1 so streaming responses and persistent connections work.
        proxy_http_version 1.1;

        # Forward useful request information to FastAPI.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chat endpoint uses Server-Sent Events. Disable buffering so events
        # reach the browser immediately instead of waiting for a full response.
        proxy_buffering off;
        proxy_cache off;

        # Allow long-running streamed chat responses to remain open.
        proxy_read_timeout 3600s;
    }

    # Serve React files directly. If a requested path is not a real file,
    # return index.html so client-side React routes can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
